<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UTM-TVAS Login</title>
  
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  
  <style>
    body {
      background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
      height: 100vh;
      display: flex;
      align-items: center;
    }
    
    .login-card {
      border: none;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card login-card">
          <div class="card-body p-4">
            
            <!-- Back Button -->
            <div class="mb-3">
              <a href="start.html" class="text-decoration-none text-dark">
                <i class="bi bi-arrow-left"></i> Back to Role Selection
              </a>
            </div>
            
            <!-- Icon -->
            <div class="text-center mb-3">
              <i class="bi bi-mortarboard-fill text-success fs-1"></i>
            </div>
            
            <!-- Title -->
            <h3 class="text-center fw-bold" id="loginTitle">UTM-TVAS Login</h3>
            <p class="text-center text-muted small mb-4">
              Enter your credentials to continue
            </p>
            
            <!-- Login Form -->
            <form id="loginForm">
              <!-- Username -->
              <div class="mb-3">
                <label id="idLabel" class="form-label fw-bold">Matric ID</label>
                <input type="text" id="login" class="form-control" 
                       placeholder="Enter your Matric/Staff ID" required>
              </div>
              
              <!-- Password -->
              <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <input type="password" id="password" class="form-control" 
                       placeholder="Enter your IC number" required>
                <small id="passwordHint" class="text-muted"></small>
              </div>
              
              <!-- Login Button -->
              <button type="submit" id="btnLogin" class="btn btn-success w-100 mt-3">
                Login to System
              </button>
              
              <!-- Message Display -->
              <div id="loginMessage" class="mt-3"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- Your scripts - FIXED PATHS -->
  <script src="../models/ttmsModel.js"></script>
  <script src="../controllers/authController.js"></script>
  
  <script>
    // Update UI based on role parameter
    $(document).ready(function() {
      const params = new URLSearchParams(window.location.search);
      const role = params.get("role") || "student";
      
      const title = $("#loginTitle");
      const idLabel = $("#idLabel");
      const passwordHint = $("#passwordHint");
      
      if (role === "student") {
        title.text("Student Login");
        idLabel.text("Matric Number");
        passwordHint.text("Format: IC number without '-' (e.g., 010101011234)");
      } 
      else if (role === "lecturer") {
        title.text("Lecturer Login");
        idLabel.text("Staff ID");
        passwordHint.text("Format: IC number without '-'");
      } 
      else if (role === "admin") {
        title.text("Administrator Login");
        idLabel.text("Admin ID");
        passwordHint.text("Use administrator credentials");
      }
      
      // Focus on first input
      $("#login").focus();
    });
  </script>
</body>
</html>
