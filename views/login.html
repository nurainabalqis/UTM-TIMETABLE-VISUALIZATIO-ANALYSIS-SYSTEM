<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UTM-TVAS | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #E8F5E9 0%, #C8E6C9 100%);
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .role-indicator {
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
        }
        .student-indicator {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }
        .lecturer-indicator {
            background: linear-gradient(135deg, #4CAF50, #2E7D32);
            color: white;
        }
        .admin-indicator {
            background: linear-gradient(135deg, #D32F2F, #B71C1C);
            color: white;
        }
    </style>
</head>

<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card login-card">
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <img src="assets/utm-logo.png" alt="UTM Logo" height="60" onerror="this.style.display='none'">
                    </div>

                    <h3 class="text-center fw-bold text-success mb-1">UTM-TVAS</h3>
                    <p class="text-center text-muted small mb-4">
                        Timetable Visualization & Analysis System
                    </p>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="fas fa-user me-2"></i>ID Number
                            </label>
                            <input type="text" id="login" class="form-control form-control-lg"
                                   placeholder="Enter your Matric/Staff ID" required>
                            <small class="text-muted">
                                Enter your Matric Number (students) or Staff ID (lecturers)
                            </small>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">
                                <i class="fas fa-lock me-2"></i>Password
                            </label>
                            <input type="password" id="password" class="form-control form-control-lg"
                                   placeholder="Enter your password" required>
                            <small class="text-muted">
                                Use IC number without dashes (e.g., 010101011234)
                            </small>
                        </div>

                        <button type="submit" id="btnLogin" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-sign-in-alt me-2"></i>Login to System
                        </button>

                        <div id="roleDetectionInfo" class="text-center mt-3" style="display: none;">
                            <small class="text-muted">
                                <i class="fas fa-info-circle me-1"></i>
                                System will automatically detect if you're a student or lecturer
                            </small>
                        </div>

                        <div id="loginMessage" class="mt-3"></div>
                    </form>

                </div>
            </div>

            <div class="text-center mt-3">
                <small class="text-muted">
                    <i class="fas fa-shield-alt me-1"></i>
                    Secure login powered by UTM TTMS
                </small>
            </div>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../models/ttmsModel.js"></script>
<script src="../controllers/authController.js"></script>

<script>
/* ================= ADMIN CREDENTIALS ================= */
const ADMIN_ACCOUNTS = [
    { username: 'admin12345', password: '123456789' }
];

$(document).ready(function() {

    $('#login, #password').on('focus', function() {
        $('#roleDetectionInfo').slideDown();
    });

    $("#loginForm").on("submit", async function (e) {
        e.preventDefault();

        const username = $("#login").val().trim();
        const password = $("#password").val().trim();
        const btn = $("#btnLogin");

        if (!username || !password) {
            showMessage("Please enter both ID and password.", "warning");
            return;
        }

        btn.prop("disabled", true).html(`
            <span class="spinner-border spinner-border-sm me-2"></span>
            Authenticating...
        `);

        $("#loginMessage").empty();

        /* ================= ADMIN LOGIN ================= */
        const adminMatch = ADMIN_ACCOUNTS.find(
            acc => acc.username === username && acc.password === password
        );

        if (adminMatch) {
            const user = {
                username: username,
                name: 'System Administrator',
                role: 'admin',
                description: 'Administrator',
                loginTime: new Date().toISOString()
            };

            localStorage.setItem("user", JSON.stringify(user));
            TTMS.setCurrentSession('2025/2026', '1');

            showMessage(`
                <div class="alert alert-success mb-0">
                    <i class="fas fa-user-shield me-2"></i>
                    <strong>Administrator Login Successful</strong>
                    <br>Welcome, System Administrator
                    <br>
                    <span class="role-indicator admin-indicator">
                        <i class="fas fa-user-shield me-1"></i> ADMIN
                    </span>
                    <br><small class="mt-2 d-block">Redirecting to dashboard...</small>
                </div>
            `, "success");

            setTimeout(() => {
                window.location.href = "../index.html";
            }, 1500);

            return;
        }

        /* ================= TTMS LOGIN ================= */
        try {
            const loginResponse = await TTMS.login(username, password);

            if (loginResponse.status !== "success") {
                showMessage(loginResponse.message || "Invalid credentials.", "danger");
                btn.prop("disabled", false).html('<i class="fas fa-sign-in-alt me-2"></i>Login to System');
                return;
            }

            const role = detectRoleFromDescription(loginResponse.description);

            const user = {
                username: username,
                name: loginResponse.nama || username,
                role: role,
                description: role.charAt(0).toUpperCase() + role.slice(1),
                loginTime: new Date().toISOString(),
                session_id: loginResponse.session_id
            };

            localStorage.setItem("user", JSON.stringify(user));
            TTMS.setCurrentSession('2025/2026', '1');

            const roleIndicatorClass =
                role === 'student' ? 'student-indicator' :
                role === 'lecturer' ? 'lecturer-indicator' : 'admin-indicator';

            showMessage(`
                <div class="alert alert-success mb-0">
                    <i class="fas fa-check-circle me-2"></i>
                    <strong>Login Successful!</strong>
                    <br>Welcome ${user.name}
                    <br>
                    <span class="role-indicator ${roleIndicatorClass}">
                        <i class="fas ${role === 'student' ? 'fa-graduation-cap' :
                                         role === 'lecturer' ? 'fa-chalkboard-teacher' :
                                         'fa-user-shield'} me-1"></i>
                        ${role.toUpperCase()}
                    </span>
                    <br><small class="mt-2 d-block">Redirecting to your dashboard...</small>
                </div>
            `, "success");

            setTimeout(() => {
                window.location.href = "../index.html";
            }, 1500);

        } catch (error) {
            console.error(error);
            showMessage("Network error. Please try again.", "danger");
            btn.prop("disabled", false).html('<i class="fas fa-sign-in-alt me-2"></i>Login to System');
        }
    });

    function detectRoleFromDescription(description) {
        if (!description) return 'student';
        const desc = description.toLowerCase();
        if (desc.includes('pensyarah') || desc.includes('lecturer')) return 'lecturer';
        if (desc.includes('admin')) return 'admin';
        return 'student';
    }

    function showMessage(message, type) {
        const iconMap = {
            success: 'check-circle',
            danger: 'times-circle',
            warning: 'exclamation-triangle',
            info: 'info-circle'
        };
        const icon = iconMap[type] || 'info-circle';
        $("#loginMessage").html(`
            <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                <i class="fas fa-${icon} me-2"></i>${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        `);
    }
});
</script>
</body>
</html>
