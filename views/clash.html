<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TTMS Clash Detection Dashboard</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Charts -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

    <style>
        body { background-color: #f8f9fa; }
        h3 { margin-bottom: 1.5rem; }
        .chart-container { margin-bottom: 2rem; }
        .table-container { max-height: 500px; overflow-y: auto; }
    </style>
</head>
<body>

<div class="container mt-4">
    <h3> TTMS Room Clash Detection Dashboard</h3>
 
    
    <!-- Summary -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-bg-danger">
                <div class="card-body">
                    <h5>Total Clashes</h5>
                    <h2 id="totalClashes">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-primary">
                <div class="card-body">
                    <h5>N28 Clashes</h5>
                    <h2 id="n28Clashes">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-bg-warning">
                <div class="card-body">
                    <h5>N28A Clashes</h5>
                    <h2 id="n28aClashes">0</h2>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Charts -->
    <div class="row">
        <div class="col-md-6">
            <div class="card chart-container">
                <div class="card-body">
                    <h5>Clash Count by Building (Bar)</h5>
                    <div id="barChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card chart-container">
                <div class="card-body">
                    <h5>Clash Distribution by Building (Pie)</h5>
                    <div id="pieChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card chart-container">
                <div class="card-body">
                    <h5>Clash Count per Day</h5>
                    <div id="dayChart" style="height: 300px;"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Data Table -->
    <div class="row mt-4">
        <div class="col-md-12">
            <div class="card">
                <div class="card-body">
                    <h5>📋 Detailed Schedule Records</h5>
                    <div class="table-container">
                        <table class="table table-striped table-hover" id="clashTable">
                            <thead class="table-dark sticky-top">
                                <tr>
                                    <th>No.</th>
                                    <th>Room Code</th>
                                    <th>Room Name</th>
                                    <th>Day</th>
                                    <th>Time</th>
                                    <th>Subject</th>
                                    <th>Section</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="8" class="text-center">Click "Load TTMS Data" to start</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- ONLY CHANGE: load external JS -->
<script src="../controllers/clashController.js"></script>

</body>
</html>
